syntax = "proto3";

package protoc_gen_crud.test_cases.as_timestamp_field;

option go_package = "github.com/samlitowitz/protoc-gen-crud/test-cases/as-timestamp-field";

import "options/v1/annotations.proto";
import "google/protobuf/timestamp.proto";

message AsTimestamp {
  option (options.v1.crud_message_options) = {
    implementations: [IMPLEMENTATION_SQLITE, IMPLEMENTATION_PGSQL]
    primary_key: ["id"]
  };
  int32 id = 1;
  google.protobuf.Timestamp timestamp = 2 [
    (options.v1.crud_field_options) = {
      as_timestamp: true
    }
  ];
  google.protobuf.Timestamp timestamp_two = 3 [
    (options.v1.crud_field_options) = {
      as_timestamp: true
    }
  ];
}
