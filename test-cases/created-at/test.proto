syntax = "proto3";

package protoc_gen_crud.test_cases.created_at;

option go_package = "github.com/samlitowitz/protoc-gen-crud/test-cases/created-at";

import "protoc_gen_crud/options/v1/annotations.proto";
import "google/protobuf/timestamp.proto";

message CreatedAt {
  option (options.v1.crud_message_options) = {
    implementations: [IMPLEMENTATION_SQLITE, IMPLEMENTATION_PGSQL]
    primary_key: ["id"]
    created_at: "createdAt"
  };
  int32 id = 1;
  string data = 2;
  google.protobuf.Timestamp createdAt = 3 [
    (options.v1.crud_field_options) = {
      as_timestamp: true
    }
  ];
}
