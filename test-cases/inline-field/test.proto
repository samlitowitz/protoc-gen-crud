syntax = "proto3";

package protoc_gen_crud.test_cases.inline_field;

option go_package = "github.com/samlitowitz/protoc-gen-crud/test-cases/inline-field";

import "options/v1/annotations.proto";
import "google/protobuf/timestamp.proto";

message InlineTimestamp {
  option (options.v1.crud_message_options) = {
    implementations: [IMPLEMENTATION_SQLITE, IMPLEMENTATION_PGSQL]
    primaryKey: ["id"]
  };
  int32 id = 1;
  google.protobuf.Timestamp timestamp = 2 [
    (options.v1.crud_field_options) = {
      inline: true
    }
  ];
}
