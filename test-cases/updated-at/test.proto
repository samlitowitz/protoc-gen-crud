syntax = "proto3";

package protoc_gen_crud.test_cases.updated_at;

option go_package = "github.com/samlitowitz/protoc-gen-crud/test-cases/updated-at";

import "protoc-gen-crud/options/v1/annotations.proto";
import "google/protobuf/timestamp.proto";

message UpdatedAt {
  option (options.v1.crud_message_options) = {
    implementations: [IMPLEMENTATION_SQLITE, IMPLEMENTATION_PGSQL]
    primary_key: ["id"]
    updated_at: "updatedAt"
  };
  int32 id = 1;
  string data = 2;
  google.protobuf.Timestamp updatedAt = 3 [
    (options.v1.crud_field_options) = {
      as_timestamp: true
    }
  ];
}
